name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # Weekly: the generated project's dependency ranges have no lockfile, so this
    # catches upstream releases that break `init` output without any CLI change.
    - cron: '0 6 * * 1'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Package contents
        run: |
          npm run build
          node scripts/check-pack.mjs

  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: node scripts/check-pack.mjs

      - name: Pack and install CLI from tarball
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP"/fastify-ep-*.tgz

      - name: init, generate, doctor, upgrade
        run: |
          mkdir -p "$RUNNER_TEMP/harness"
          cd "$RUNNER_TEMP/harness"
          fastify-ep init demo-app --pm npm --preset standard --database none --di native
          cd demo-app
          fastify-ep generate resource users --crud
          fastify-ep generate module orders
          fastify-ep doctor --strict
          fastify-ep upgrade --dry-run

      - name: Install, typecheck, test and build the generated project
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: |
          npm install
          npm run typecheck
          npm run test
          npm run build

  integration:
    name: integration (${{ matrix.pm }}, ${{ matrix.database }}, ${{ matrix.di }}, ${{ matrix.preset || 'standard' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, yarn]
        database: [none, drizzle, prisma]
        di: [native]
        # Awilix is a thin overlay, so it gets a reduced matrix instead of doubling every job.
        include:
          - { pm: npm, database: none, di: awilix }
          - { pm: npm, database: drizzle, di: awilix }
          - { pm: npm, database: prisma, di: awilix }
          - { pm: pnpm, database: none, di: awilix }
          # Presets other than the default. Production also builds the Docker image, once per package manager.
          - { pm: npm, database: none, di: native, preset: minimal }
          - { pm: npm, database: none, di: native, preset: production }
          - { pm: pnpm, database: prisma, di: native, preset: production }
          - { pm: yarn, database: prisma, di: native, preset: production }
    env:
      # Only database projects read this; it is harmless for `none`.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Enable corepack
        run: corepack enable

      # pnpm 11 changed install behaviour for dependency build scripts; test what users get.
      - name: Pin pnpm 11
        if: matrix.pm == 'pnpm'
        run: corepack prepare pnpm@11 --activate

      - run: npm ci

      - run: npm run build

      - name: Pack tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Tarball ships every template file
        run: |
          tarball=$(ls "$RUNNER_TEMP"/fastify-ep-*.tgz)
          for f in templates/gitignore template-overlays/drizzle/.env.example template-overlays/prisma/.env.example; do
            tar -tzf "$tarball" | grep -qx "package/$f" || { echo "missing from tarball: $f"; exit 1; }
          done

      - name: Install CLI from tarball (not the working tree)
        run: npm install -g "$RUNNER_TEMP"/fastify-ep-*.tgz

      - name: fastify-ep init
        run: |
          mkdir -p "$RUNNER_TEMP/harness"
          cd "$RUNNER_TEMP/harness"
          fastify-ep init demo-app --pm ${{ matrix.pm }} --preset ${{ matrix.preset || 'standard' }} --database ${{ matrix.database }} --di ${{ matrix.di }}

      - name: Install generated project's dependencies
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.pm }} install

      - name: Generated project has .gitignore
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: grep -qx '.env' .gitignore

      - name: Doctor (fresh project)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: fastify-ep doctor --strict

      - name: Typecheck (fresh project)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.pm }} run typecheck

      - name: Test (fresh project)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.pm }} run test

      - name: Build (fresh project)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.pm }} run build

      - name: fastify-ep generate module
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: fastify-ep generate module orders

      - name: fastify-ep g resource (CRUD)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: fastify-ep g resource users --crud

      # The Prisma client is generated at install, before the resource added its model.
      - name: Regenerate the Prisma client
        if: matrix.database == 'prisma'
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: npx prisma generate

      - name: Doctor (after generate)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: fastify-ep doctor --strict

      - name: Typecheck (after generate)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.pm }} run typecheck

      - name: Test (after generate)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.pm }} run test

      - name: Build (after generate)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.pm }} run build

      - name: Apply the schema to Postgres
        if: matrix.database != 'none'
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.database == 'drizzle' && 'npx drizzle-kit push --force' || 'npx prisma db push' }}

      - name: Smoke test (probes, CRUD routes, graceful shutdown, unreachable database)
        working-directory: ${{ runner.temp }}/harness/demo-app
        env:
          PRESET: ${{ matrix.preset || 'standard' }}
        run: ${{ github.workspace }}/scripts/smoke.sh ${{ matrix.database }} users

      - name: Repository test against Postgres (must run, not skip)
        if: matrix.database != 'none'
        working-directory: ${{ runner.temp }}/harness/demo-app
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
        run: |
          npx vitest run --reporter=json --outputFile="$RUNNER_TEMP/vitest.json"
          node -e "
            const r = JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/vitest.json', 'utf8'));
            const file = r.testResults.find((f) => f.name.endsWith('users.repository.test.ts'));
            const tests = file ? file.assertionResults : [];
            const notPassed = tests.filter((t) => t.status !== 'passed');
            if (tests.length === 0 || notPassed.length > 0) {
              console.error('repository test did not fully run:', tests.map((t) => t.status));
              process.exit(1);
            }
            console.log('repository test ran against Postgres:', tests.length, 'tests passed');
          "

      - name: Build the Docker image (needs the lockfile from the install step)
        if: matrix.preset == 'production'
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: docker build -t demo-app .

  workspace:
    name: workspace (${{ matrix.pm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, yarn]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Enable corepack
        run: corepack enable

      # Same pnpm as the integration job. Yarn runs as Berry 4: the workspace pins it in package.json.
      - name: Pin pnpm 11
        if: matrix.pm == 'pnpm'
        run: corepack prepare pnpm@11 --activate

      - run: npm ci

      - run: npm run build

      - name: Pack tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install CLI from tarball (not the working tree)
        run: npm install -g "$RUNNER_TEMP"/fastify-ep-*.tgz

      # Two services and a library in one workspace: init/generate from several directories, one root
      # install, typecheck/test/build/smoke each package, then build and run the Production image
      # from the workspace root.
      - name: Workspace smoke test
        run: ${{ github.workspace }}/scripts/workspace-smoke.sh ${{ matrix.pm }} "$RUNNER_TEMP/workspace-demo"

  # Real projects from earlier releases: the tag's own CLI generates them, the CLI under test upgrades
  # them, and the result must equal fresh output and install, typecheck, test and build.
  upgrade:
    name: upgrade from ${{ matrix.tag }} (${{ matrix.preset }}, ${{ matrix.database }}, ${{ matrix.di }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: v0.6.0, preset: production, database: none, di: native }
          - { tag: v0.6.0, preset: standard, database: drizzle, di: native }
          - { tag: v0.6.1, preset: standard, database: none, di: native }
          - { tag: v0.7.0, preset: production, database: drizzle, di: native }
          - { tag: v0.8.0, preset: standard, database: none, di: awilix }
    steps:
      - uses: actions/checkout@v4
        with:
          # The fixtures are built from release tags.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Upgrade smoke test
        run: ${{ github.workspace }}/scripts/upgrade-smoke.sh ${{ matrix.tag }} ${{ matrix.preset }} ${{ matrix.database }} ${{ matrix.di }} "$RUNNER_TEMP/upgrade-demo"

  components:
    name: components (${{ matrix.database }}, ${{ matrix.di }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { database: none, di: native }
          - { database: drizzle, di: awilix }
          - { database: prisma, di: native }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Add a service, a schema and a repository, then check the project (repository tests must run)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
        run: scripts/component-smoke.sh ${{ matrix.database }} ${{ matrix.di }} "$RUNNER_TEMP/components"

  typescript:
    name: typescript ${{ matrix.ts }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Generated projects default to TypeScript 6. 5 is what projects created before 0.12 still use;
        # 7 is the next major. Both must keep working.
        ts: [5, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Generated projects typecheck, test and build with TypeScript ${{ matrix.ts }}
        run: scripts/typescript-compat.sh ${{ matrix.ts }} "$RUNNER_TEMP/ts-compat"

  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { example: drizzle-api, database: drizzle }
          - { example: prisma-api, database: prisma }
          - { example: awilix-api, database: drizzle }
          - { example: minimal-api, database: none, preset: minimal }
          - { example: production-api, database: drizzle, preset: production }
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Examples match what the CLI generates today
        run: |
          npm run examples
          git diff --exit-code -- examples/
          test -z "$(git ls-files --others --exclude-standard examples/)" || { git ls-files --others --exclude-standard examples/; exit 1; }

      - name: Install
        working-directory: examples/${{ matrix.example }}
        run: npm install

      - name: Doctor
        working-directory: examples/${{ matrix.example }}
        run: node ${{ github.workspace }}/dist/cli.js doctor --strict

      - name: Typecheck
        working-directory: examples/${{ matrix.example }}
        run: npm run typecheck

      - name: Test
        working-directory: examples/${{ matrix.example }}
        run: npm run test

      - name: Build
        working-directory: examples/${{ matrix.example }}
        run: npm run build

      - name: Apply the schema to Postgres
        if: matrix.database != 'none'
        working-directory: examples/${{ matrix.example }}
        run: ${{ matrix.database == 'prisma' && 'npx prisma db push' || 'npx drizzle-kit push --force' }}

      - name: Smoke test
        working-directory: examples/${{ matrix.example }}
        env:
          PRESET: ${{ matrix.preset || 'standard' }}
        run: ${{ github.workspace }}/scripts/smoke.sh ${{ matrix.database }} users

      - name: Repository test against Postgres (must run, not skip)
        if: matrix.database != 'none'
        working-directory: examples/${{ matrix.example }}
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
        run: |
          npx vitest run --reporter=json --outputFile="$RUNNER_TEMP/vitest.json"
          node -e "
            const r = JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/vitest.json', 'utf8'));
            const file = r.testResults.find((f) => f.name.endsWith('users.repository.test.ts'));
            const tests = file ? file.assertionResults : [];
            if (tests.length === 0 || tests.some((t) => t.status !== 'passed')) {
              console.error('repository test did not fully run:', tests.map((t) => t.status));
              process.exit(1);
            }
            console.log('repository test ran against Postgres:', tests.length, 'tests passed');
          "

  publish:
    needs:
      [
        lint-and-build,
        cross-platform,
        integration,
        workspace,
        upgrade,
        components,
        typescript,
        examples,
      ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json version
        run: |
          pkg=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "v${pkg}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json version v${pkg}"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: node scripts/check-pack.mjs

      - run: npm test

      - run: npm publish --provenance
