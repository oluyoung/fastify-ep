name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # Weekly: the generated project's dependency ranges have no lockfile, so this
    # catches upstream releases that break `init` output without any CLI change.
    - cron: '0 6 * * 1'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  integration:
    name: integration (${{ matrix.pm }}, ${{ matrix.database }}, ${{ matrix.di }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, yarn]
        database: [none, drizzle, prisma]
        di: [native]
        # Awilix is a thin overlay, so it gets a reduced matrix instead of doubling every job.
        include:
          - { pm: npm, database: none, di: awilix }
          - { pm: npm, database: drizzle, di: awilix }
          - { pm: npm, database: prisma, di: awilix }
          - { pm: pnpm, database: none, di: awilix }
    env:
      # Only database projects read this; it is harmless for `none`.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable corepack
        run: corepack enable

      # pnpm 11 changed install behaviour for dependency build scripts; test what users get.
      - name: Pin pnpm 11
        if: matrix.pm == 'pnpm'
        run: corepack prepare pnpm@11 --activate

      - run: npm ci

      - run: npm run build

      - name: Pack tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Tarball ships every template file
        run: |
          tarball=$(ls "$RUNNER_TEMP"/fastify-ep-*.tgz)
          for f in templates/gitignore template-overlays/drizzle/.env.example template-overlays/prisma/.env.example; do
            tar -tzf "$tarball" | grep -qx "package/$f" || { echo "missing from tarball: $f"; exit 1; }
          done

      - name: Install CLI from tarball (not the working tree)
        run: npm install -g "$RUNNER_TEMP"/fastify-ep-*.tgz

      - name: fastify-ep init
        run: |
          mkdir -p "$RUNNER_TEMP/harness"
          cd "$RUNNER_TEMP/harness"
          fastify-ep init demo-app --pm ${{ matrix.pm }} --database ${{ matrix.database }} --di ${{ matrix.di }}

      - name: Install generated project's dependencies
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.pm }} install

      - name: Generated project has .gitignore
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: grep -qx '.env' .gitignore

      - name: Doctor (fresh project)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: fastify-ep doctor

      - name: Typecheck (fresh project)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.pm }} run typecheck

      - name: Test (fresh project)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.pm }} run test

      - name: Build (fresh project)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.pm }} run build

      - name: fastify-ep generate module
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: fastify-ep generate module orders

      - name: Doctor (after generate)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: fastify-ep doctor

      - name: Typecheck (after generate)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.pm }} run typecheck

      - name: Test (after generate)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.pm }} run test

      - name: Build (after generate)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ matrix.pm }} run build

      - name: Smoke test (probes, graceful shutdown, unreachable database)
        working-directory: ${{ runner.temp }}/harness/demo-app
        run: ${{ github.workspace }}/scripts/smoke.sh ${{ matrix.database }}

  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [drizzle-api, prisma-api, awilix-api]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Examples match what the CLI generates today
        run: |
          npm run examples
          git diff --exit-code -- examples/
          test -z "$(git ls-files --others --exclude-standard examples/)" || { git ls-files --others --exclude-standard examples/; exit 1; }

      - name: Install
        working-directory: examples/${{ matrix.example }}
        run: npm install

      - name: Doctor
        working-directory: examples/${{ matrix.example }}
        run: node ${{ github.workspace }}/dist/cli.js doctor

      - name: Typecheck
        working-directory: examples/${{ matrix.example }}
        run: npm run typecheck

      - name: Test
        working-directory: examples/${{ matrix.example }}
        run: npm run test

      - name: Build
        working-directory: examples/${{ matrix.example }}
        run: npm run build

      - name: Smoke test
        working-directory: examples/${{ matrix.example }}
        run: ${{ github.workspace }}/scripts/smoke.sh ${{ matrix.example == 'prisma-api' && 'prisma' || 'drizzle' }}

  publish:
    needs: [lint-and-build, integration, examples]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json version
        run: |
          pkg=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "v${pkg}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json version v${pkg}"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: npm publish --provenance
